# 归类边界。不写清楚模型会在边界上摇摆（参考文档 §5 坑 5）。
boundary_rules:
  - 给词或成语填空属「逻辑填空」；给整句填空属「语句表达」
  # 下面这条是 50 题 MVP 跑出来后补的：3 道逻辑填空里有 1 道把全为成语的题标成了
  # 「实词辨析」，而它的考点细节自己写着"四个选项均为成语/四字词"——细节与考点自相矛盾。
  # 根因是边界没写死，模型在边界上摇摆（参考文档 §5 坑 5）。判据必须落到「选项形态」上，
  # 因为这是唯一可机械判定的特征。
  - 逻辑填空按**选项形态**定考点，不看题干空格数：选项全为成语或四字固定词组 →「成语辨析」；选项全为普通实词 →「实词辨析」；选项混有实词与成语，或一道题多个空分属上述两类 →「实词与成语综合辨析」
  - 问"这段文字意在说明/主要观点"属「片段阅读-中心理解」；问"与原文相符/不符"属「片段阅读-细节判断」
  - 题干给出材料数据求某个量属「资料分析」；题干无材料、纯文字表述数量关系属「数量关系」
  - 「综合分析」只在同一道题需要跨两个及以上考点的判断时使用，不得当作兜底——单考点题必须落到具体考点
  # v1.3 补：MVP 实测模型把"七一讲话中的四个伟大成就"标成「新思想-重要讲话」，
  # 而「时事政治-重要讲话」同样存在——两个槽位在打架，模型只能猜。
  # 判据落在"考的是思想性提法还是时政事实"上，这是可机械判定的。
  # v1.4 改写：v1.3 那句"思想性提法 → 重要论述与讲话精神"太宽，300 题验证时
  # 27 道新思想题全挤进那一个槽位。改成先定形态再定领域的三步判据。
  # 注意：YAML 里以 * 开头的列表项会被当成别名引用，所以规则不要以 ** 开头
  - 新思想的归类「先看形态，再看领域」，三步走：① 考文献/讲话的**原文表述**（原话填空、表述正误）→「新思想-重要文献与讲话原文」；② 考该思想的**整体定位与核心内容**（三大规律、六个必须坚持、两个确立、总任务）→「新思想-理论定位与核心内容」；③ 考**某个具体领域的论述** → 对应领域考点（生态文明建设 / 文化传承发展 / 全面依法治国 / 乡村振兴 …）。**不要一看到"讲话"两个字就归进「重要文献与讲话原文」**——实测这样会让它变成筐
  - 考查**时政事实**的（会议何时何地召开、政策数字、人事变动）→「时事政治」；考思想性提法的按上一条走。同一场讲话按**考什么**分，不按讲话本身分
  - 逻辑填空与片段阅读的考点名**不得同义换写**：「下文推断」与「承接叙述」是**同一个考点**，统一用「承接叙述」；「标题选择」与「标题填入」统一用「标题填入」。归类歧义时以二级题型名为准
  - 党章与党的组织制度（党员条件、代表大会职权、党的纪律、入党程序）→「党章党规」，不要放进「新思想」——党章与习近平思想不是同一层概念
  # v1.3 补：源数据的粗标签会把现代制度类常识标成「人文常识」（实测 1 例）。
  # 粗标签只是参考，归类以本规则为准。
  - 常识判断里的制度类考点按**时代**分：由现行法律法规确立的现代制度（公务员制度、选举制度、监察制度）→「法律常识」；古代与历史制度（科举制、三省六部制、均田制）→「人文常识-历史事件」

# 扩展口：封闭规范表会让真实的新考法无处可去（参考文档 §5 坑 4）。
# 实测长尾约 0.9%，审查后全是真实新考法，不是噪声。
extension_rule: 若确属本表覆盖不到的新考法，可新增三级考点，但必须同样带「大类-」前缀且与已有考点不重叠；不得使用同义词换写已有考点。
