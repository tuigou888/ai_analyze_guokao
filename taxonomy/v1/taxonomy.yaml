# 考点规范表 · v1.5
#
# v1.5 依据 500 题验证跑（批次 verify-500，460 条产出）的 5 个新增考点修订：
#   管理常识（组织结构）、法律常识-经济法、法律常识-其他法律法规、
#   数学运算-数字问题、马克思主义基本原理-劳动异化理论
# 每条都是真实的知识类别缺口，模型自造反而说明规范表该补。
#
# v1.4 依据 300 题验证跑（批次 verify-300，235 条产出）修订：
#   ① v1.3 对「新思想」的修法过度矫正（一个宽槽位吃下 27 题、领域毫无区分力）→ 补 11 个领域考点、改写边界判据
#   ② 新增「法律常识-劳动法与社会保障法」：来自新增考点，是真实缺口
#   ③ 补"不得同义换写"规则：「下文推断」= 「承接叙述」
#
# v1.3 依据 P3 蒸馏 MVP（批次 mvp-50-multi，41 条产出）的三项发现修订：
#   ①v1.3 的三项修订见下（②③条已在 v1.4 被进一步修正）
#   ① 「新思想」分档维度选错：原按主题领域分，实测主体是"会议/讲话中的提法"，补两个分档
#   ② 新增「党章党规」二级题型：原无处可去，会污染「新思想」
#   ③ 「公务员制度」原被标进人文常识：补「法律常识-公务员制度与公务员法」，并加时代边界规则
# 每条修订都写明了实测依据（题量/命中数），便于日后回溯为什么这样分。
#
# v1.2 修正：常识判断与政治理论下的三级考点前缀原先写短了（"人文-""马原-""时政-"），
# 与二级题型名（"人文常识""马克思主义基本原理""时事政治"）不一致，导致校验器
# 拒绝了规范表**自己列出的**考点——白烧 4 次 API 调用。前缀规则是「必须等于二级题型名」，
# 写全，不用简称。现在有一道测试（taxonomy_test.go）保证这类不一致不会再出现。
#
# 这是**代码资产**，不是 prompt 里的一段字符串。蒸馏用的 prompt 由本表程序化生成
# （见 internal/distill/prompt.go），原因见 docs/架构方案.md §6.3：
#
#   - 把枚举写进 prompt，模型会把它当成"偏好名单"，把没见过的新考法压平成示例
#     （参考文档 §5 坑 1）
#   - 给了规范表模型又会漏写大类前缀（坑 2），所以前缀必须在质检里校验
#
# 二级题型取自数据集自带的粗标签统计（实测：综合 4089 / 增长 2238 / 片段阅读 1812 /
# 逻辑填空 1068 / 比重 1024 / 平均数 733 / 图形推理 572 / 类比推理 566 / 人文常识 525 /
# 逻辑判断 496 / 定义判断 484 / 数学运算 445 / 语句表达 387 / 法律常识 188 / 新思想 119 /
# 科技常识 73 / 经济常识 63 / 时事政治 45 / 地理国情 20 / 倍数 20 / 毛中特 15 / 马克思主义 4）。
# 注意"综合"占 27%，是兜底标签，不作为二级题型——它恰恰是蒸馏要拆开的东西。

version: v1.5
modules:
  - subject: 政治理论
    # v1.3 重构：50 题 MVP 暴露「新思想」的分档维度选错了。
    #
    # 原分档按**主题领域**分（以人民为中心 / 中国式现代化 / 新发展理念 …），
    # 但实测这些主题词在全库只命中 138 题，而「新思想」标签下有 1419 题。
    # 抽查看实际在考什么，主体是**某次会议/讲话/报告里的具体提法**：
    #   会议 133 / 大会 102 / 讲话 75 / 报告指出 63 / 全会 58（政治理论内命中数）
    # 例："习近平在文艺工作座谈会讲话中列举的名篇""十八大报告指出…是…"
    # 这些题原来无处可去，只能挤进最接近的主题分档，导致同题型内一题一考点。
    # 所以补上按**文献与提法**的分档，与主题领域分档并存。
    secondary:
      # v1.4：v1.3 的修法**过度矫正**了。当时只补了「重要论述与讲话精神」一个宽槽位，
      # 300 题验证跑出来 27 道新思想题全部落进它——27:1 的收敛度看着漂亮，
      # 但那是"筐"不是"考点"：抽查这 27 题的领域，横跨外交、党史、文化、治疆、
      # 十五五规划、乡村振兴、粮食安全、依法治国……对不同领域毫无区分力，
      # 学习者在考点页上看到它得不到任何信息。
      #
      # 根因是领域分档太窄（只有 5 个），逼得模型把一切塞进最接近的宽槽位。
      # 实测政治理论各领域题量：生态文明 135 / 文化传承 80 / 教育人才 69 /
      # 依法治国 69 / 党的建设 37 / 外交国际 35 / 经济体制 33 / 区域发展 28 /
      # 乡村振兴 18 / 科技自立 14 —— 都够格独立成档。
      #
      # 所以改成两个维度并存：
      #   形态维度：理论定位与核心内容 / 重要文献与讲话原文
      #   领域维度：13 个具体领域
      # 判据写进 boundary_rules：先看考什么形态，再定领域；**不能见到"讲话"就
      # 归进「重要文献与讲话原文」**，那正是 v1.3 让它变成筐的原因。
      - name: 新思想
        tertiary:
          - 新思想-理论定位与核心内容
          - 新思想-重要文献与讲话原文
          - 新思想-以人民为中心
          - 新思想-中国式现代化
          - 新思想-新发展理念
          - 新思想-全面深化改革
          - 新思想-全面从严治党
          - 新思想-经济体制与高质量发展
          - 新思想-生态文明建设
          - 新思想-文化传承发展
          - 新思想-教育与人才
          - 新思想-全面依法治国
          - 新思想-外交与国际秩序
          - 新思想-区域协调发展
          - 新思想-乡村振兴
          - 新思想-科技自立自强
      - name: 马克思主义基本原理
        tertiary:
          - 马克思主义基本原理-唯物论
          - 马克思主义基本原理-辩证法
          - 马克思主义基本原理-认识论
          - 马克思主义基本原理-唯物史观
          # v1.5 新增：来自 500 题验证跑。劳动异化理论是马原的高频独立考点。
          - 马克思主义基本原理-劳动异化理论
      - name: 毛泽东思想和中国特色社会主义理论体系
        tertiary:
          - 毛泽东思想和中国特色社会主义理论体系-新民主主义革命
          - 毛泽东思想和中国特色社会主义理论体系-社会主义改造
          - 毛泽东思想和中国特色社会主义理论体系-改革开放
      # v1.3 新增：党章/党的组织制度原先无处可去。实测该类题 68 道
      # （党章 14 / 党员 33 / 中央委员会 17 / 党的组织 4 / 党的纪律 3），
      # 原分档下只能挤进「新思想」，而党章与习近平思想并不是一回事。
      - name: 党章党规
        tertiary:
