<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>行测研习 · UI改版参考样例（静态演示）</title>
<style>
:root{--brand:#285da8;--brand-dark:#204f92;--brand-light:#eaf2ff;--bg:#f4f7fb;--side:#edf3fa;--surface:#fff;--text:#172b4d;--sub:#64748b;--muted:#8b9bb0;--border:#dbe4f0;--green:#137a62;--danger:#b74048;--amber:#a66b14;--r:13px;--shadow:0 2px 12px rgba(31,64,113,.025)}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83b5ff;outline-offset:2px}a{color:inherit;text-decoration:none}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 18px;z-index:10}.brand{display:flex;align-items:center;gap:10px;padding:1px 8px 24px}.brand-icon{display:grid;place-items:center;background:var(--brand);width:38px;height:38px;color:#fff;border-radius:10px;font-size:23px;font-family:serif}.brand strong{font-size:18px;line-height:1.2}.brand small{display:block;color:var(--sub);font-size:11px;margin-top:3px}.nav-group{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin:18px 12px 8px}.nav{display:flex;align-items:center;gap:10px;min-height:42px;border:0;background:none;text-align:left;color:var(--sub);border-radius:9px;width:100%;padding:0 12px;margin:1px 0;font-weight:550}.nav:hover{background:#e3edfa;color:var(--brand)}.nav.active{background:#dce8fa;color:#1e539e;font-weight:700}.nav-icon{width:22px;height:22px;display:grid;place-items:center;border:1px solid #c7d8ee;border-radius:6px;font-size:12px;font-weight:700}.nav-count{margin-left:auto;background:#fff;border:1px solid #d6e2f0;border-radius:6px;padding:0 6px;font-size:11px}.side-spacer{flex:1}.side-footer{border-top:1px solid var(--border);padding-top:14px}.side-quote{padding:12px;margin-top:12px;color:#697d99;font-family:serif;font-size:14px;line-height:1.8}
.main{min-width:0}.topbar{height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.breadcrumb{color:var(--sub);font-size:12px}.top-actions{display:flex;align-items:center;gap:12px}.demo-badge{font-size:11px;color:#8e641a;background:#fff7e8;border:1px solid #f4e1bb;border-radius:7px;padding:5px 8px}.avatar{width:30px;height:30px;display:grid;place-items:center;background:#e7effc;color:var(--brand);border:1px solid #d2e1f6;border-radius:50%;font-weight:700}.container{max-width:1360px;margin:0 auto;padding:36px 32px 72px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}.page-head h1{font-size:28px;line-height:1.25;margin:0 0 8px;letter-spacing:-.5px}.page-head p{margin:0;color:var(--sub)}.head-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--border);background:#fff;color:#254369;border-radius:9px;padding:9px 16px;min-height:40px;transition:background .13s,border-color .13s;white-space:nowrap}.btn:hover{border-color:#afc7e7;background:#f7fbff}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650}.btn.primary:hover{background:var(--brand-dark)}.btn.ghost{background:transparent}.btn.sm{padding:5px 11px;min-height:32px;font-size:12px}.btn.danger{color:var(--danger)}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}.section{margin-bottom:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head h2{font-size:17px;margin:0}.section-head span{color:var(--sub);font-size:12px}.filter{padding:18px 20px}.filter-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.filter-row>.field{flex:1;min-width:165px}.filter-row>.field.search{flex:2;min-width:260px}.field label{display:block;color:#506988;font-size:12px;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:#83adf2;box-shadow:0 0 0 3px rgba(61,128,220,.09)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;align-items:center}.chip,.badge{border-radius:7px;font-size:11px;padding:4px 8px;background:#ebf2ff;color:#2d64ad;font-weight:600}.chip{border:1px solid #d1e0f5}.badge.gray{background:#f1f4f9;color:#61758f}.badge.warn{background:#fff3da;color:#9a670f}.badge.green{background:#dff7ee;color:#14765e}.muted{color:var(--sub)}.tiny{font-size:12px}.questions .qrow{padding:20px 22px;display:flex;gap:18px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.questions .qrow:last-child{border-bottom:0}.qrow .qcopy{max-width:880px;min-width:0}.meta{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:11px;flex-wrap:wrap;margin-bottom:9px}.qtitle{margin:0;font-weight:600;line-height:1.65}.qbottom{margin-top:8px;color:var(--muted);font-size:11px}.panel-title{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border);font-weight:700}.pager{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;color:var(--sub);font-size:12px}.paper-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.paper{min-height:224px;padding:20px;display:flex;flex-direction:column}.paper h3{font-size:15px;line-height:1.6;margin:16px 0 8px;min-height:48px}.paper .bottom{margin-top:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{padding:22px}.stat .number{font-size:30px;font-weight:750;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-1px}.stat .number small{font-size:13px;font-weight:500;color:var(--sub);margin-left:5px}.records .record{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border)}.records .record:last-child{border-bottom:0}.record h3{margin:0 0 5px;font-size:14px}.record p{color:var(--sub);font-size:12px;margin:0}.tabbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.tab{background:transparent;border:1px solid transparent;padding:10px 16px;border-radius:9px;color:var(--sub);font-weight:600}.tab.active{background:#e5efff;color:var(--brand);border-color:#c2d8f8}.map-layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px}.tree{padding:20px}.tree h3{font-size:15px;margin:0 0 14px}.tree .node{padding:9px 12px;border-radius:8px;display:block;color:var(--sub)}.tree .node.active{background:#e8f1ff;color:var(--brand);font-weight:700}.tree .node.nested{margin-left:12px}.map-list{padding:18px}.knowledge{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:16px 6px}.knowledge:last-child{border:0}.knowledge strong{font-size:14px}.knowledge p{margin:4px 0 0;color:var(--sub);font-size:12px}.progress{height:8px;background:#e7edf6;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--brand);border-radius:20px}.goal{padding:22px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:18px 0}.goal h3{margin:0 0 7px;font-size:14px}.goal p{margin:0;color:var(--sub);font-size:13px}.profile-tabs{margin-bottom:24px;border-bottom:1px solid var(--border);display:flex}.profile-tabs button{border:0;background:none;padding:13px 18px;color:var(--sub);border-bottom:2px solid transparent}.profile-tabs button.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}.form-card{padding:24px;max-width:900px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.form-card h3{font-size:16px;margin:0 0 14px}.form-section{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}.form-section:last-child{border:0;margin:0;padding:0}.admin-layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px}.admin-menu{padding:12px}.admin-menu button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:11px 12px;border-radius:8px;color:var(--sub)}.admin-menu button.active{background:var(--brand-light);color:var(--brand);font-weight:700}.table-card{overflow:auto}.table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}.table th{background:#f7f9fd;text-align:left;color:#526782;padding:14px 16px;font-weight:650}.table td{padding:15px 16px;border-top:1px solid var(--border)}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.admin-top h3{margin:0;font-size:16px}.notice{background:#eef5ff;border:1px solid #d6e5fb;color:#3b639a;padding:14px 16px;border-radius:10px;margin-bottom:18px;font-size:13px}.footer-note{padding:18px 0;text-align:center;color:#8a99ad;font-size:11px}.mobile-toggle{display:none;border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 10px}.cover{display:none}.toast{position:fixed;right:24px;bottom:22px;max-width:320px;background:#172b4d;color:white;border-radius:10px;padding:12px 16px;z-index:50;box-shadow:0 14px 35px #172b4d33;display:none}.toast.visible{display:block}.empty{padding:36px 18px;text-align:center;color:var(--sub)}
@media (max-width:1200px){.paper-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:28px 24px 58px}}
@media (max-width:900px){.shell{grid-template-columns:64px minmax(0,1fr)}.sidebar{padding:18px 7px}.brand{padding:2px 5px 18px}.brand strong,.brand small,.nav-group,.nav span:not(.nav-icon),.nav-count,.side-quote{display:none}.nav{justify-content:center;padding:0}.nav-icon{width:34px;height:34px}.side-footer{padding-top:10px}.topbar{padding:0 20px}.map-layout{grid-template-columns:205px 1fr}.admin-layout{grid-template-columns:165px 1fr}}
@media (max-width:700px){.shell{display:block}.sidebar{width:245px;position:fixed;transform:translateX(-101%);transition:transform .2s;padding:20px 14px}.sidebar.show{transform:translateX(0)}.sidebar.show .brand strong,.sidebar.show .brand small,.sidebar.show .nav-group,.sidebar.show .nav span:not(.nav-icon),.sidebar.show .side-quote{display:block}.sidebar.show .nav{justify-content:flex-start;padding:0 12px}.sidebar.show .nav-icon{width:22px;height:22px}.cover.show{display:block;position:fixed;inset:0;background:#15284288;z-index:9}.mobile-toggle{display:inline-block}.topbar{height:58px;padding:0 14px}.breadcrumb{font-size:12px}.top-actions{gap:7px}.demo-badge{font-size:10px}.container{padding:22px 14px 56px}.page-head{align-items:start;flex-direction:column;margin-bottom:18px}.page-head h1{font-size:23px}.head-actions{width:100%}.head-actions .btn{flex:1}.paper-grid,.stats,.goal-grid,.form-grid,.map-layout,.admin-layout{grid-template-columns:1fr}.filter-row>.field.search{min-width:100%}.filter-row>.field{min-width:calc(50% - 6px)}.filter-row>.btn{flex:1}.questions .qrow{align-items:stretch;flex-direction:column;padding:16px}.qrow .btn{align-self:flex-end}.paper{min-height:200px}.map-layout .tree{max-height:240px;overflow:auto}.admin-menu{display:flex;flex-wrap:wrap;gap:5px}.admin-menu button{width:auto}.goal-grid{gap:14px}.records .record{padding:16px;align-items:flex-start;flex-direction:column}.record .btn{align-self:flex-end}.profile-tabs{overflow:auto;white-space:nowrap}.profile-tabs button{flex-shrink:0}.top-actions .muted{display:none}}
</style>
</head>
<body>
<div class="cover" id="cover"></div>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="页面导航">
  <div class="brand"><span class="brand-icon">行</span><div><strong>行测研习</strong><small>专注真题 · 系统提升</small></div></div>
  <div class="nav-group">学习中心</div>
  <button class="nav active" data-page="questions"><span class="nav-icon">题</span><span>题库练习</span></button>
  <button class="nav" data-page="papers"><span class="nav-icon">卷</span><span>真题试卷</span></button>
  <button class="nav" data-page="knowledge"><span class="nav-icon">知</span><span>考点地图</span></button>
  <div class="nav-group">复习与记录</div>
  <button class="nav" data-page="wrong"><span class="nav-icon">错</span><span>错题本</span><span class="nav-count">4</span></button>
  <button class="nav" data-page="favorites"><span class="nav-icon">藏</span><span>我的收藏</span></button>
  <button class="nav" data-page="records"><span class="nav-icon">记</span><span>学习记录</span></button>
  <div class="side-spacer"></div><div class="side-footer"><button class="nav" data-page="profile"><span class="nav-icon">我</span><span>个人中心</span></button><button class="nav" data-page="admin"><span class="nav-icon">管</span><span>管理后台</span></button><div class="side-quote">看懂一道题，<br>再走稳下一步。</div></div>
</aside>
<section class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-toggle" id="mobileToggle" aria-label="展开导航">☰</button><span class="breadcrumb" id="crumb">学习中心 / 题库练习</span></div><div class="top-actions"><span class="demo-badge">布局参考 · 非正式网站</span><span class="muted tiny">演示用户</span><div class="avatar">行</div></div></header>
  <main class="container" id="content"></main>
  <div class="footer-note">行测研习 UI/UX 改版静态参考 · 无真实登录、无 API、无保存操作</div>
</section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const data={
 questions:[
  {cat:'资料分析',id:27449,text:'2017年中国内地出口额占全部比重大于进口额占全部比重的国家和地区有：',info:'单选题 · 2017年'},
  {cat:'资料分析',id:27448,text:'2017年中国内地与下列四个国家和地区中实现贸易逆差的是：',info:'单选题 · 2017年'},
  {cat:'资料分析',id:27447,text:'2016年中国内地对日本的进口额约为：',info:'单选题 · 2016年'},
  {cat:'资料分析',id:27446,text:'中国内地进口额与出口额相差最大的国家和地区是：',info:'单选题 · 2016年'},
 ],
 papers:[
  {year:'2026',region:'云南',title:'2026年云南省公务员录用考试《行测》题（网友回忆版）',num:'8',type:'省考'},
  {year:'2026',region:'上海',title:'2026年上海市公务员录用考试《行测》题（网友回忆版）',num:'30',type:'市考'},
  {year:'2026',region:'内蒙古',title:'2026年内蒙古公务员录用考试《行测》题（网友回忆版）',num:'14',type:'省考'},
  {year:'2026',region:'吉林',title:'2026年吉林省公务员录用考试《行测》试题',num:'—',type:'省考'},
  {year:'2026',region:'四川',title:'2026年四川省公务员录用考试《行测》试题',num:'—',type:'省考'},
  {year:'2026',region:'全国',title:'2026年国家公务员考试《行测》题',num:'—',type:'国考'},
 ],
 knowledge:[{name:'位置规律',n:6},{name:'属性规律',n:1},{name:'数量规律',n:3},{name:'样式规律',n:1},{name:'空间重构',n:4}]
};
const state={page:'questions',adv:false,region:'全部地区',query:'',wrongTab:'待订正',profileTab:'学习总览',adminTab:'系统配置'};
function toast(msg='这是静态布局参考：实际业务操作需要在原项目中接入。'){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('visible'),2600)}
function heading(title,desc,action=''){return `<header class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action?`<div class="head-actions">${action}</div>`:''}</header>`}
function b(text='开始练习',kind='primary'){return `<button class="btn ${kind}" data-demo>${text}</button>`}
function tag(text,color=''){return `<span class="badge ${color}">${text}</span>`}
function pageQuestions(){let q=data.questions.filter(x=>x.text.includes(state.query)||x.info.includes(state.query)||x.cat.includes(state.query)||String(x.id).includes(state.query));return `${heading('题库练习','按模块查找真题，从一道题开始。',`<div class="muted tiny">本次题量：20 题</div>${b('开始专项练习')}`)}<div class="card filter section"><div class="filter-row"><div class="field search"><label for="q-search">关键词</label><input id="q-search" placeholder="搜索题干、题号或考点名称" value="${state.query.replace(/"/g,'&quot;')}" /></div><div class="field"><label>模块</label><select id="module"><option>全部模块</option><option>资料分析</option><option>判断推理</option><option>政治理论</option></select></div><button class="btn primary" id="q-submit">搜索</button><button class="btn" id="adv">${state.adv?'收起':'高级筛选'} ▾</button></div>${state.adv?`<div class="filter-row" style="margin-top:16px"><div class="field"><label>年份</label><select><option>全部年份</option><option>2026</option><option>2025</option></select></div><div class="field"><label>地区</label><select><option>全部地区</option><option>河北</option><option>山东</option></select></div><div class="field"><label>考试类型</label><select><option>全部类型</option><option>国考</option><option>省考</option></select></div><div class="field"><label>卷别</label><select><option>全部卷别</option></select></div></div>`:''}</div><div class="section-head"><h2>真题列表 <span class="muted tiny">27,449 道题（原截图示例）</span></h2><span>每页 20 题</span></div><div class="card questions">${q.length?q.map(x=>`<div class="qrow"><div class="qcopy"><div class="meta">${tag(x.cat)}<span>${x.info}</span><span>#${x.id}</span></div><p class="qtitle">${x.text}</p><div class="qbottom">真题 · 详细来源以实际数据为准</div></div>${b('查看题目 ↗','')}</div>`).join(''):`<div class="empty">没有符合条件的参考题目。正式项目应展示实际搜索结果。</div>`}<div class="pager"><span>示例数据，仅用于布局</span><span>上一页　 1　 下一页</span></div></div>`}
function pagePapers(){let list=data.papers.filter(x=>state.region==='全部地区'||x.region===state.region);return `${heading('真题试卷','保留试卷结构，一套题检验真实理解。')}<div class="card filter section"><div class="filter-row"><div class="field"><label>模块</label><select><option>全部模块</option><option>政治理论</option></select></div><div class="field"><label>年份</label><select><option>全部年份</option><option>2026</option></select></div><div class="field"><label for="region">地区（示例筛选）</label><select id="region">${['全部地区','云南','上海','内蒙古','吉林','四川','全国'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>考试类型</label><select><option>全部类型</option><option>国考</option><option>省考</option><option>市考</option></select></div></div></div><div class="section-head"><h2>试卷列表</h2><span>三列紧凑卡片</span></div><div class="paper-grid">${list.map(x=>`<article class="card paper"><div class="meta">${tag(x.year)} <span>${x.region} · ${x.type}</span></div><h3>${x.title}</h3><div class="bottom"><span class="tiny muted">${x.num==='—'?'题数以数据源为准':x.num+' 道题'} · 行测</span><button class="btn sm" data-demo>开始作答 ↗</button></div></article>`).join('')}</div>`}
function pageKnowledge(){return `${heading('考点地图','按照知识层级逐级定位考点，关联相应真题。',`<div><div style="font-size:26px;font-weight:750;text-align:right;color:var(--brand)">107</div><div class="tiny muted">已归纳考点（截图示例）</div></div>`)}<div class="notice">当前仅展示已有标注覆盖的考点与真题数量，掌握情况须以实际作答数据计算。</div><div class="map-layout"><div class="card tree"><h3>知识目录</h3><span class="node">政治理论</span><span class="node active">判断推理</span><span class="node nested active">图形推理</span><span class="node nested">定义判断</span><span class="node nested">类比推理</span><span class="node">言语理解</span><span class="node">资料分析</span><span class="node">数量关系</span></div><div class="card map-list"><div class="section-head"><h2>判断推理 / 图形推理</h2><span>5 个考点</span></div>${data.knowledge.map(k=>`<div class="knowledge"><div><strong>${k.name}</strong><p>关联真题 ${k.n} 道</p></div><button class="btn sm" data-demo>查看考点 ↗</button></div>`).join('')}</div></div>`}
function pageWrong(){return `${heading('错题本','优先解决尚未订正的错误，复习操作集中展示。',b('批量复习'))}<div class="tabbar">${['待订正','已订正','全部记录'].map(x=>`<button class="tab ${state.wrongTab===x?'active':''}" data-wrong-tab="${x}">${x}${x==='待订正'?' 4':''}</button>`).join('')}</div><div class="card questions">${[863,864,865,866].map((id,i)=>`<div class="qrow"><div class="qcopy"><div class="meta">${tag('政治理论')}<span>单选题</span><span>#${id}</span>${tag(state.wrongTab==='已订正'?'已订正':'待订正',state.wrongTab==='已订正'?'green':'warn')}</div><p class="qtitle">${['习近平总书记指出，全面依法治国是国家治理的一场深刻革命，关系党执政兴国……','习近平总书记强调，要站在推进强国建设、民族复兴伟业的战略高度……','建设美丽中国是全面建设社会主义现代化国家的重要目标……','关于发展与改革的相关论述，请选出正确选项……'][i]}</p><div class="qbottom">答错 1 次 · 题目内容仅作布局演示</div></div><div style="display:flex;gap:7px;align-items:center">${b('重新练习') }<button class="btn sm" data-demo>···</button></div></div>`).join('')}</div>`}
function pageFavorites(){return `${heading('我的收藏','重要题目集中保留，适合反复回顾。',b('练习收藏题'))}<div class="card questions">${[863,862].map((id,i)=>`<div class="qrow"><div class="qcopy"><div class="meta">${tag('政治理论')}<span>单选题</span><span>#${id}</span><span>收藏于 2026-09-30</span></div><p class="qtitle">${i===0?'习近平总书记指出，全面依法治国是国家治理的一场深刻革命……':'习近平总书记指出，要提高政治判断力、政治领悟力、政治执行力……'}</p></div><div style="display:flex;gap:8px">${b('开始练习','')}<button class="btn sm" data-demo>···</button></div></div>`).join('')}</div>`}
function pageRecords(){return `${heading('学习记录','每一次练习都可回顾，未完成的练习可以继续。',b('开始新的练习'))}<div class="stats section">${[['累计作答','8','次'],['作答正确率','25','%'],['待订正题','4','题'],['完成练习','1','份']].map(x=>`<div class="card stat"><div class="muted tiny">${x[0]}</div><div class="number">${x[1]}<small>${x[2]}</small></div></div>`).join('')}</div><div class="card records"><div class="panel-title"><span>练习记录</span><span class="tiny muted">历史数据 · 状态以实际接口为准</span></div><div class="record"><div><h3>专项练习 ${tag('进行中')}</h3><p>2026/10/08 开始 · 共 20 题 · 已保存进度依原有记录确定</p></div>${b('继续练习','')}</div><div class="record"><div><h3>专项练习 ${tag('进行中')}</h3><p>2026/10/02 开始 · 共 1 题</p></div>${b('继续练习','')}</div><div class="record"><div><h3>已完成练习 ${tag('已完成','green')}</h3><p>历史累计完成 1 份 · 具体记录以实际数据为准</p></div>${b('查看记录','')}</div></div>`}
function pageProfile(){const tabs=['学习总览','复习助手','资料与偏好','账户安全'];let inside='';if(state.profileTab==='学习总览'){inside=`<div class="card goal section"><div class="section-head"><h2>今日双目标</h2><span>7天 / 30天 / 90天</span></div><div class="goal-grid"><div><h3>作答目标</h3><p>0 / 20 次</p><div class="progress"><i style="width:0%"></i></div></div><div><h3>记录时长</h3><p>0 / 30 分钟</p><div class="progress"><i style="width:0%"></i></div></div></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="tiny muted">今日尚未开始有效练习</span>${b('开始今日练习')}</div></div><div class="stats">${[['期内作答','0','次'],['期内正确率','—',''],['期内记录时长','0.0','分钟'],['历史累计作答','8','次']].map(x=>`<div class="card stat"><div class="tiny muted">${x[0]}</div><div class="number">${x[1]}<small>${x[2]}</small></div></div>`).join('')}</div>`}else if(state.profileTab==='复习助手'){inside=`<div class="card goal section"><div class="section-head"><h2>接着上次练</h2></div><p class="muted tiny">专项练习 · 20 题 · 2026-10-08 开始</p><div style="margin-top:15px">${b('继续练习')}</div></div><div class="card goal"><div class="section-head"><h2>错题优先复练</h2><span>待订正 4 题</span></div><p>针对近期答错的题目，重新练习并巩固。</p><div style="margin-top:15px">${b('开始错题复练')}</div></div>`}else if(state.profileTab==='资料与偏好'){inside=`<div class="card form-card"><div class="form-section"><h3>个人资料</h3><div class="form-grid"><div class="field"><label>用户名</label><input value="demo" disabled></div><div class="field"><label>昵称</label><input value="演示用户"></div></div><div class="field" style="margin-top:17px"><label>简介</label><input placeholder="填写简介"></div></div><div class="form-section"><h3>考试与学习目标</h3><div class="form-grid"><div class="field"><label>目标考试</label><select><option>请选择考试目标</option></select></div><div class="field"><label>今日目标</label><input placeholder="例如20题"></div></div></div>${b('保存设置')}</div>`}else{inside=`<div class="card form-card"><div class="form-section"><h3>修改密码</h3><div class="field"><label>当前密码</label><input type="password" placeholder="当前密码"></div><div class="field" style="margin-top:14px"><label>新密码</label><input type="password" placeholder="新密码"></div><div style="margin-top:16px">${b('修改密码')}</div></div><div><h3>活跃登录会话</h3><p class="muted tiny">当前设备、最近登录与注销功能在正式版保持现有后台行为。</p>${b('查看会话','')}</div></div>`}return `${heading('个人中心','整理学习计划、复习任务和个人资料。')}<div class="profile-tabs">${tabs.map(x=>`<button data-profile-tab="${x}" class="${state.profileTab===x?'active':''}">${x}</button>`).join('')}</div>${inside}`}
function pageAdmin(){let all=['系统配置','用户管理','管理员账号','我的账户'];let inside='';if(state.adminTab==='系统配置'){inside=`<div class="admin-layout"><div class="card admin-menu"><button class="active" data-demo>LLM 接口</button><button data-demo>邮件服务</button><button data-demo>用户额度</button><button data-demo>成本与预算</button><button data-demo>参考约定</button></div><div class="card form-card"><div class="form-section"><h3>LLM 接口</h3><p class="muted tiny">配置服务地址、模型与调用限制。所有凭据均为占位符。</p></div><div class="form-grid"><div class="field"><label>API 地址（OpenAI兼容）</label><input value="https://example.invalid/v1"></div><div class="field"><label>API Key</label><input type="password" value="example-placeholder"></div><div class="field"><label>模型名称</label><input placeholder="按实际模型填入"></div><div class="field"><label>并发数</label><input type="number" value="2"></div><div class="field"><label>单请求超时（秒）</label><input type="number" value="120"></div></div><div style="margin-top:24px;display:flex;gap:8px">${b('保存配置')}${b('测试连接','')}</div></div></div>`}else if(state.adminTab==='用户管理'){inside=`<div class="card filter section"><div class="filter-row"><div class="field"><label>状态</label><select><option>全部状态</option></select></div><div class="field"><label>角色</label><select><option>全部角色</option></select></div><div class="field search"><label>关键词</label><input placeholder="搜索用户名或昵称"></div>${b('查询')}</div></div><div class="card table-card"><div class="panel-title">用户列表</div><table class="table"><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>会员到期</th><th>最近登录</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>demo</td><td>${tag('会员')}</td><td>${tag('正常','green')}</td><td>2030-12-21</td><td>示例时间</td><td><button class="btn sm" data-demo>操作 ···</button></td></tr></tbody></table></div>`}else if(state.adminTab==='管理员账号'){inside=`<div class="card form-card section"><h3>新建管理员</h3><div class="form-grid"><div class="field"><label>用户名</label><input placeholder="请输入用户名"></div><div class="field"><label>初始密码</label><input type="password" placeholder="至少8位"></div><div class="field"><label>角色</label><select><option>运营管理员</option></select></div></div><div style="margin-top:18px;display:flex;justify-content:flex-end">${b('创建管理员')}</div></div><div class="card table-card"><div class="panel-title">管理员列表</div><table class="table"><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>创建</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>admin</td><td>${tag('超级管理员')}</td><td>示例日期</td><td><button class="btn sm" data-demo>操作 ···</button></td></tr></tbody></table></div>`}else{inside=`<div class="card form-card"><h3>管理员账户安全</h3><div class="field"><label>当前密码</label><input type="password"></div><div class="field" style="margin-top:14px"><label>新密码</label><input type="password"></div><div style="margin-top:18px">${b('修改并重新登录')}</div></div>`}return `${heading('网站管理','系统设置与账户维护，沿用原有管理员权限与数据逻辑。')}<div class="tabbar">${all.map(x=>`<button class="tab ${state.adminTab===x?'active':''}" data-admin-tab="${x}">${x}</button>`).join('')}</div>${inside}`}
const pages={questions:['学习中心 / 题库练习',pageQuestions],papers:['学习中心 / 真题试卷',pagePapers],knowledge:['学习中心 / 考点地图',pageKnowledge],wrong:['复习与记录 / 错题本',pageWrong],favorites:['复习与记录 / 我的收藏',pageFavorites],records:['复习与记录 / 学习记录',pageRecords],profile:['个人中心 / 学习工作台',pageProfile],admin:['管理后台 / 网站管理',pageAdmin]};
function render(){document.getElementById('content').innerHTML=pages[state.page][1]();document.getElementById('crumb').textContent=pages[state.page][0];document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===state.page));document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',()=>toast()))}
function selectPage(key){state.page=key;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('show');document.getElementById('cover').classList.remove('show')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){selectPage(nav.dataset.page);return}const adv=e.target.closest('#adv');if(adv){state.adv=!state.adv;render();return}const btn=e.target.closest('#q-submit');if(btn){state.query=document.getElementById('q-search').value.trim();render();return}const w=e.target.closest('[data-wrong-tab]');if(w){state.wrongTab=w.dataset.wrongTab;render();return}const p=e.target.closest('[data-profile-tab]');if(p){state.profileTab=p.dataset.profileTab;render();return}const a=e.target.closest('[data-admin-tab]');if(a){state.adminTab=a.dataset.adminTab;render();return}});
document.addEventListener('change',e=>{if(e.target.id==='region'){state.region=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q-search'){state.query=e.target.value.trim();render()}if(e.key==='Escape'){document.getElementById('sidebar').classList.remove('show');document.getElementById('cover').classList.remove('show')}});
document.getElementById('mobileToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('show');document.getElementById('cover').classList.add('show')});document.getElementById('cover').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('show');document.getElementById('cover').classList.remove('show')});
render();
</script>
</body></html>
