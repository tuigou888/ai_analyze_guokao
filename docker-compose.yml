services:
  gk:
    image: ${IMAGE_NAME:-practice-gk}:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: gk
    restart: unless-stopped
    volumes:
      - ./var/db:/opt/gk/var/db
      - ./var/data:/opt/gk/var/data
      - ./var/secret.key:/opt/gk/var/secret.key:ro
      - ./var/logs:/opt/gk/var/logs
      - ./var/backups:/opt/gk/var/backups
    ports:
      - "127.0.0.1:${GK_HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - GOMAXPROCS=${GOMAXPROCS:-2}
      - GOMEMLIMIT=${GOMEMLIMIT:-768MiB}
      - GK_SECRET_KEY=${GK_SECRET_KEY:-}
    command:
      - serve
      - --db=/opt/gk/var/db/gk.sqlite
      - --data=/opt/gk/var/data
      - --secret-key-file=/opt/gk/var/secret.key
      - --addr=0.0.0.0:8080
      - "--public-origin=https://${DOMAIN:?请复制 deploy/.env.example 为 .env 并填写 DOMAIN}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gk-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: ${IMAGE_NAME:-practice-gk}:${IMAGE_TAG:-latest}
    container_name: gk-backup
    restart: "no"
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec /opt/gk/gk backup
        --db /opt/gk/var/db/gk.sqlite
        --secret-key-file /opt/gk/var/secret.key
        --bundle /opt/gk/var/backups/gk-$$(date +%Y%m%d-%H%M%S)
    volumes:
      - ./var/db:/opt/gk/var/db
      - ./var/secret.key:/opt/gk/var/secret.key:ro
      - ./var/backups:/opt/gk/var/backups
    environment:
      - TZ=Asia/Shanghai
      - GK_SECRET_KEY=${GK_SECRET_KEY:-}
    networks:
      - gk-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  gk-net:
    driver: bridge
